<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik's Cube Solver 3D</title>
    <script src="wasm_exec.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            width: 100vw;
            background: #1e1e24; 
            color: #fff;
            overflow: hidden;
        }
        #ui-container { 
            width: 350px; 
            flex-shrink: 0;
            padding: 2rem; 
            background: #2b2b36; 
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #3d-container { 
            flex-grow: 1; 
            height: 100%;
            display: block; 
        }
        h2 { margin-top: 0; color: #4CAF50; }
        input { 
            padding: 0.8rem; 
            width: 100%; 
            font-size: 1rem; 
            margin-bottom: 1rem;
            background: #1e1e24;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }
        button { 
            padding: 0.8rem; 
            width: 100%; 
            font-size: 1rem; 
            font-weight: bold;
            cursor: pointer; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            transition: background 0.3s;
        }
        button:hover { background: #45a049; }
        button:disabled { background: #555; cursor: not-allowed; }
        #result-box {
            margin-top: 1rem;
            padding: 1rem;
            background: #1e1e24;
            border-left: 4px solid #4CAF50;
            border-radius: 4px;
            font-family: monospace;
            min-height: 50px;
        }
        #status { font-size: 0.9rem; margin-bottom: 1.5rem; color: #ff9800; }
    </style>
</head>
<body>
    <div id="ui-container">
        <h2>Kociemba 3D Solver</h2>
        <div id="status">Loading WebAssembly...</div>
        
        <label for="scramble">Enter Scramble:</label>
        <input type="text" id="scramble" value="R U F2 D' L2 B'" placeholder="Scramble (e.g., R U F2)">
        <button id="solveBtn" disabled>Solve Cube</button>
        
        <div id="result-box">Solution will appear here...</div>
    </div>

    <div id="3d-container"></div>

    <script src="app.js"></script>
</body>
</html>
