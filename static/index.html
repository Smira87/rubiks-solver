<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rubik's Cube Solver WASM</title>
    <script src="wasm_exec.js"></script>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #f4f4f9; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px;}
        input { padding: 0.5rem; width: 70%; font-size: 1rem; }
        button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        #result { margin-top: 1rem; font-weight: bold; color: #28a745; }
        #status { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Go Kociemba Solver (WASM)</h2>
        <div id="status">Loading WASM Engine (Generating Tables)...</div>
        
        <!-- Добавляем тег label, связанный с инпутом через атрибут for -->
        <label for="scramble">Scramble Formula:</label>
        <input type="text" id="scramble" value="U R F2 U' D L2 B'" placeholder="e.g., R U F2">
        
        <button id="solveBtn" disabled>Solve</button>
        
        <div id="result"></div>
    </div>

    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("solver.wasm"), go.importObject).then((result) => {
            go.run(result.instance); 
            document.getElementById("status").innerText = "Engine Ready! 🚀";
            document.getElementById("status").style.color = "#28a745";
            document.getElementById("solveBtn").disabled = false;
        }).catch(err => console.error(err));

        document.getElementById("solveBtn").addEventListener("click", () => {
            const scramble = document.getElementById("scramble").value;
            const t0 = performance.now();
            
            // Calling Go function from JS!
            const solution = window.kociembaSolve(scramble);
            
            const t1 = performance.now();
            document.getElementById("result").innerText = `Solution: ${solution} \n(Time: ${(t1 - t0).toFixed(2)} ms)`;
        });
    </script>
</body>
</html>
