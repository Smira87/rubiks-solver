<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik's Cube Solver 3D</title>
    <script src="wasm_exec.js"></script>
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #1e1e24; 
            color: #fff;
            overflow: hidden;
        }
        #3d-container { 
            position: absolute;
            top: 0;
            bottom: 0;
            left: 350px;
            right: 350px;
            z-index: 1;
            cursor: grab;
            background: #1e1e24;
        }
        #3d-container:active { 
            cursor: grabbing; 
        }
        .panel {
            position: absolute;
            width: 350px; 
            height: 100vh;
            padding: 1.5rem; 
            background: rgba(43, 43, 54, 0.90); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 10;
            overflow-y: auto;
        }
        #left-panel { 
            top: 0;
            left: 0; 
            border-right: 1px solid rgba(255,255,255,0.1); 
        }
        #right-panel { 
            top: 0;
            right: 0; 
            border-left: 1px solid rgba(255,255,255,0.1); 
        }
        h2, h3 { 
            margin-top: 0; 
            color: #4CAF50; 
        }
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            color: #ccc; 
            font-size: 0.9rem;
        }
        input { 
            padding: 0.8rem; 
            width: 100%; 
            font-size: 1rem; 
            margin-bottom: 1rem;
            background: rgba(30, 30, 36, 0.8);
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
        }
        input[readonly] {
            color: #4CAF50;
            background: rgba(20, 20, 20, 0.8);
            cursor: default;
        }
        .row { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 1rem; 
        }
        .row input { 
            margin-bottom: 0; 
        }
        button { 
            padding: 0.8rem; 
            width: 100%; 
            font-size: 1rem; 
            font-weight: bold;
            cursor: pointer; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            transition: background 0.3s;
            margin-bottom: 0.5rem;
        }
        button:hover { 
            background: #45a049; 
        }
        button:disabled { 
            background: #555; 
            cursor: not-allowed; 
            color: #888; 
        }
        button.action-btn { 
            background: #008CBA; 
        }
        button.action-btn:hover { 
            background: #007bb5; 
        }
        #result-box {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(30, 30, 36, 0.8);
            border-left: 4px solid #4CAF50;
            border-radius: 4px;
            font-family: monospace;
            min-height: 50px;
            word-wrap: break-word;
        }
        #status { 
            font-size: 0.9rem; 
            margin-bottom: 1.5rem; 
            color: #ff9800; 
            font-weight: bold;
        }
        .move-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .move-grid button {
            background: rgba(70, 70, 80, 0.8);
            margin-bottom: 0;
            font-size: 1.2rem;
            padding: 1rem 0;
        }
        .move-grid button:hover { 
            background: #666; 
        }
        @media (max-width: 900px) {
            .panel { 
                width: 100vw; 
                border: none;
            }
            #left-panel { 
                height: 40vh;
                top: 0; 
                left: 0;
                border-bottom: 2px solid #333; 
            }
            #right-panel { 
                height: 30vh;
                top: auto; 
                bottom: 0; 
                right: 0;
                left: 0;
                border-top: 2px solid #333; 
            }
            #3d-container {
                left: 0;
                right: 0;
                top: 40vh;
                bottom: 30vh;
            }
        }
    </style>
</head>
<body>
    
    <div id="3d-container"></div>

    <div id="left-panel" class="panel">
        <h2>Kociemba 3D Solver</h2>
        <div id="status">Loading WebAssembly...</div>
        
        <label for="scramble-length">Number of moves:</label>
        <div class="row">
            <input type="number" id="scramble-length" value="20" min="1" max="50">
            <button id="randomBtn" class="action-btn">Scramble</button>
        </div>

        <label for="scramble-input">Scramble moves:</label>
        <input type="text" id="scramble-input" readonly placeholder="Cube is solved">
        
        <button id="solveBtn" disabled>Solve Cube</button>
        
        <div id="result-box">Solution will appear here...</div>
    </div>

    <div id="right-panel" class="panel">
        <h3>Move Control</h3>
        <p style="color:#aaa; font-size: 0.9rem; margin-top:0;">Manually rotate faces</p>
        
        <div class="move-grid">
            <button class="manual-move-btn" data-move="U">U</button>
            <button class="manual-move-btn" data-move="U'">U'</button>
            <button class="manual-move-btn" data-move="D">D</button>
            <button class="manual-move-btn" data-move="D'">D'</button>
            <button class="manual-move-btn" data-move="R">R</button>
            <button class="manual-move-btn" data-move="R'">R'</button>
            <button class="manual-move-btn" data-move="L">L</button>
            <button class="manual-move-btn" data-move="L'">L'</button>
            <button class="manual-move-btn" data-move="F">F</button>
            <button class="manual-move-btn" data-move="F'">F'</button>
            <button class="manual-move-btn" data-move="B">B</button>
            <button class="manual-move-btn" data-move="B'">B'</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
