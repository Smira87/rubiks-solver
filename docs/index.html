<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rubik's Cube Solver 3D</title>
    <script src="wasm_exec.js"></script>
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #121214; 
            color: #fff;
            overflow: hidden;
        }
        
        #3d-container { 
            position: absolute;
            top: 0;
            bottom: 0;
            left: 350px;
            right: 350px;
            z-index: 1;
            cursor: grab;
            background: #121214;
        }
        #3d-container:active { 
            cursor: grabbing; 
        }

        .panel {
            position: absolute;
            width: 350px; 
            height: 100vh;
            padding: 1.5rem; 
            background: rgba(28, 28, 36, 0.95); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            z-index: 10;
            overflow-y: auto;
        }
        #left-panel { 
            top: 0;
            left: 0; 
            border-right: 1px solid rgba(255,255,255,0.05); 
        }
        #right-panel { 
            top: 0;
            right: 0; 
            border-left: 1px solid rgba(255,255,255,0.05); 
        }

        h2, h3 { 
            margin-top: 0; 
            color: #4CAF50; 
            font-size: 1.4rem;
        }
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            color: #aaa; 
            font-size: 0.85rem;
        }
        input { 
            padding: 0.7rem; 
            width: 100%; 
            font-size: 0.95rem; 
            margin-bottom: 1rem;
            background: rgba(18, 18, 20, 0.8);
            border: 1px solid #3a3a44;
            color: white;
            border-radius: 6px;
        }
        input[readonly] {
            color: #4CAF50;
            background: rgba(10, 10, 12, 0.8);
            cursor: default;
        }

        button { 
            padding: 0.75rem; 
            width: 100%; 
            font-size: 0.95rem; 
            font-weight: bold;
            cursor: pointer; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            transition: all 0.2s ease;
            margin-bottom: 0.5rem;
        }
        button:hover { 
            background: #45a049; 
        }
        button:disabled { 
            background: #2a2a35; 
            cursor: not-allowed; 
            color: #5a5a65; 
            border: 1px solid #323240;
        }
        
        button.action-btn { 
            background: #e91e63; 
        }
        button.action-btn:hover { 
            background: #d81b60; 
        }

        #result-box {
            margin-top: 1rem;
            padding: 0.8rem;
            background: rgba(18, 18, 20, 0.8);
            border-left: 4px solid #4CAF50;
            border-radius: 4px;
            font-family: monospace;
            min-height: 45px;
            font-size: 0.9rem;
            word-wrap: break-word;
            margin-bottom: 1rem;
        }
        #status { 
            font-size: 0.85rem; 
            margin-bottom: 1rem; 
            color: #ff9800; 
            font-weight: bold;
        }

        .move-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .move-grid button {
            background: rgba(50, 50, 65, 0.6);
            border: 1px solid #3a3a44;
            font-size: 1.1rem;
            padding: 0.8rem 0;
            margin-bottom: 0;
        }
        .move-grid button:hover { 
            background: #4a4a5a; 
            border-color: #5a5a6a;
        }

        .mobile-action-row {
            display: block;
        }

        /* MOBILE FIXES & ALIGNMENT */
        @media (max-width: 900px) {
            body {
                display: flex;
                flex-direction: column;
                height: 100vh;
                height: -webkit-fill-available;
            }
            
            /* 1. Lock the 3D cube zone at exactly 40% height so it never pushes down */
            #3d-container {
                position: relative;
                width: 100vw;
                height: 40vh; 
                flex: none;
                left: 0;
                right: 0;
                top: 0;
                bottom: auto;
            }
            
            #left-panel h2, #right-panel h3, #right-panel p, .desktop-only {
                display: none !important;
            }

            /* 2. Control panel takes exactly the remaining 60% with absolute structure */
            .panel {
                position: relative;
                width: 100vw;
                height: auto;
                box-shadow: none;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                overflow: hidden;
                background: #1c1c24;
                flex: none;
            }

            /* 3. Tighten margins to make sure everything fits iPhone SE */
            #left-panel {
                padding: 0.4rem 1rem 0 1rem;
                border: none;
            }
            
            #status {
                margin-bottom: 0.2rem;
                font-size: 0.8rem;
            }

            label {
                margin-bottom: 0.2rem;
            }

            input {
                padding: 0.4rem 0.6rem;
                margin-bottom: 0.2rem;
                font-size: 0.85rem;
                width: 100%;
            }
            
            /* 4. Strictly limit solution box height. Any extra text forces an internal scroll */
            #result-box {
                margin-top: 0.2rem;
                padding: 0.5rem;
                min-height: 35px;
                max-height: 55px; /* Rigid constraint prevents pushing buttons down */
                overflow-y: auto;
                font-size: 0.8rem;
                margin-bottom: 0.2rem;
                width: 100%;
                border-left: 3px solid #4CAF50;
            }

            #right-panel {
                padding: 0.1rem 1rem 0.6rem 1rem;
                border: none;
                margin-top: 0;
            }
            
            /* 5. Compact 6-column button cluster anchored securely to the floor */
            .move-grid {
                grid-template-columns: repeat(6, 1fr);
                gap: 5px;
                width: 100%;
            }
            .move-grid button {
                font-size: 0.85rem;
                padding: 0.45rem 0;
                border-radius: 4px;
                margin-bottom: 0;
            }

            .mobile-action-row {
                display: flex;
                gap: 8px;
                padding: 0.1rem 0 0.3rem 0;
                background: #1c1c24;
                width: 100%;
            }
            .mobile-action-row button {
                flex: 1;
                padding: 0.6rem 0;
                font-size: 0.9rem;
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
    
    <div id="3d-container"></div>

    <!-- LEFT PANEL -->
    <div id="left-panel" class="panel">
        <h2>Kociemba 3D Solver</h2>
        <div id="status">Loading WebAssembly...</div>
        
        <div class="desktop-only">
            <label for="scramble-length">Number of moves:</label>
            <input type="number" id="scramble-length" value="20" min="1" max="50">
        </div>

        <label for="scramble-input">Scramble moves:</label>
        <input type="text" id="scramble-input" readonly placeholder="Cube is solved">
        
        <div id="result-box">Solution will appear here...</div>

        <div class="mobile-action-row">
            <button id="randomBtn" class="action-btn">Scramble</button>
            <button id="solveBtn" disabled>Solve Cube</button>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="right-panel" class="panel">
        <h3>Move Control</h3>
        <p style="color:#aaa; font-size: 0.9rem; margin-top:0;">Manually rotate faces</p>
        
        <div class="move-grid">
            <button class="manual-move-btn" data-move="U">U</button>
            <button class="manual-move-btn" data-move="U'">U'</button>
            <button class="manual-move-btn" data-move="D">D</button>
            <button class="manual-move-btn" data-move="D'">D'</button>
            <button class="manual-move-btn" data-move="R">R</button>
            <button class="manual-move-btn" data-move="R'">R'</button>
            <button class="manual-move-btn" data-move="L">L</button>
            <button class="manual-move-btn" data-move="L'">L'</button>
            <button class="manual-move-btn" data-move="F">F</button>
            <button class="manual-move-btn" data-move="F'">F'</button>
            <button class="manual-move-btn" data-move="B">B</button>
            <button class="manual-move-btn" data-move="B'">B'</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
