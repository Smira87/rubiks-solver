name: SonarCloud Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Disabling shallow clone is recommended for a better relevancy of analysis

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Replace with your project Go version if needed

      - name: Run Tests with Coverage
        # Run table-driven tests (e.g., TestCnk) and generate the coverage report file
        run: go test -v -coverprofile=coverage.out ./...

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically generated by GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Repository secret configured in GitHub settings
