sonar.projectKey=smira87_rubiks-solver
sonar.organization=smira87
sonar.host.url=https://sonarcloud.io

# Define what to analyze (Source code)
sonar.sources=.

# Define where the test files are located
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# CRITICAL: Exclude tests AND third-party/static assets from source analysis
# We separate patterns with commas
sonar.exclusions=**/*_test.go, static/**/*

# CRITICAL: Tell Sonar to completely ignore the static folder for code coverage calculations
sonar.coverage.exclusions=static/**/*, cmd/**/*

# Reference code coverage report for Go
sonar.go.coverage.reportPaths=coverage.out
